name: Build TurboStream Desktop GUI (.EXE)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Compile Windows GUI (.exe)
      run: |
        # --windowed and --noconsole ensure NO black CMD popup appears!
        pyinstaller --onefile --windowed --noconsole --name "TurboStream_P2P" turbostream_gui.py

    - name: Upload Windows EXE
      uses: actions/upload-artifact@v4
      with:
        name: TurboStream-Desktop-GUI
        path: dist/TurboStream_P2P.exe
